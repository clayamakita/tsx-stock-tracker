name: Daily TSX price update

on:
  schedule:
    # 22:00 UTC = 6pm EDT / 5pm EST -- a couple hours after TSX closes (4pm ET),
    # Mon-Fri only. GitHub cron can run a few minutes late; that's fine.
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python daily_update.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks.db
          git diff --staged --quiet || git commit -m "Daily price update $(date -u +%F)"
          git push
